# Test code may unwrap/expect/panic/index freely; production code may not (see workspace lints).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Gate "the core is pure": no file system, no environment, no processes, no clock, no network,
# no console in library code. Crates that do I/O by design opt out with
# `#![allow(clippy::disallowed_methods, clippy::disallowed_types, clippy::disallowed_macros)]`.
disallowed-macros = [
  { path = "std::print", reason = "vibememory-core is pure logic: no console" },
  { path = "std::println", reason = "vibememory-core is pure logic: no console" },
  { path = "std::eprint", reason = "vibememory-core is pure logic: no console" },
  { path = "std::eprintln", reason = "vibememory-core is pure logic: no console" },
  { path = "std::dbg", reason = "vibememory-core is pure logic: no console" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::OpenOptions", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::DirBuilder", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::ReadDir", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::process::Command", reason = "vibememory-core is pure logic: no processes" },
  { path = "std::net::TcpStream", reason = "vibememory-core is pure logic: no network" },
  { path = "std::net::TcpListener", reason = "vibememory-core is pure logic: no network" },
  { path = "std::net::UdpSocket", reason = "vibememory-core is pure logic: no network" },
  { path = "std::os::unix::net::UnixStream", reason = "vibememory-core is pure logic: no network", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener", reason = "vibememory-core is pure logic: no network", allow-invalid = true },
]
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::copy", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::create_dir", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::create_dir_all", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::exists", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::hard_link", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::metadata", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::read", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::read_dir", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::read_link", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::read_to_string", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::remove_dir", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::remove_dir_all", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::remove_file", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::rename", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::set_permissions", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::symlink_metadata", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::fs::write", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::env::args", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::args_os", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::current_dir", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::current_exe", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::home_dir", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::remove_var", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::set_current_dir", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::set_var", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::temp_dir", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::var", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::var_os", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::vars", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::env::vars_os", reason = "vibememory-core is pure logic: no environment" },
  { path = "std::fs::soft_link", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::os::unix::fs::symlink", reason = "vibememory-core is pure logic: no I/O", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "vibememory-core is pure logic: no I/O", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "vibememory-core is pure logic: no I/O", allow-invalid = true },
  { path = "std::path::Path::exists", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::try_exists", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::is_dir", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::is_file", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::is_symlink", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::metadata", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::symlink_metadata", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::canonicalize", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::read_link", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::path::Path::read_dir", reason = "vibememory-core is pure logic: paths are data, not files" },
  { path = "std::io::stdin", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::io::stdout", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::io::stderr", reason = "vibememory-core is pure logic: no I/O" },
  { path = "std::process::exit", reason = "vibememory-core is pure logic: no processes" },
  { path = "std::thread::sleep", reason = "vibememory-core is pure logic: no waiting" },
  { path = "std::time::Instant::now", reason = "vibememory-core is pure logic: no clock, timestamps come from the caller" },
  { path = "std::time::SystemTime::now", reason = "vibememory-core is pure logic: no clock, timestamps come from the caller" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "vibememory-core is pure logic: no network" },
]
