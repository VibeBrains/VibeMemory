[package]
name = "vibememory-cli"
description = "VibeMemory engine: hooks, tick, install, doctor — the side that touches the machine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "vibememory_cli"
path = "src/lib.rs"

[[bin]]
name = "vibememory"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Which process a hook runs under and when a process started, one way on every system: the
# workspace forbids `unsafe`, and the process list is a system call on each of them.
sysinfo.workspace = true
thiserror.workspace = true
vibememory-core = { path = "../vibememory-core" }

[lints]
workspace = true

# Directory links on Windows are junctions: a symlink there needs an administrator or Developer
# Mode, and the standard library's own `junction_point` is still unstable (1.97.1).
[target.'cfg(windows)'.dependencies]
junction.workspace = true

# A log of DSH for a project directory a test makes: the fixture's logs name a directory that is
# not on this disk, and only an encoder writes one for a directory that is.
[dev-dependencies]
ruzstd.workspace = true
