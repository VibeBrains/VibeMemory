[package]
name = "vibememory-mcp"
description = "VibeMemory MCP server: one memory for every agent, over the same journal the engine keeps"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibememory_mcp"
path = "src/lib.rs"

[[bin]]
name = "vibememory-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
vibememory-cli = { path = "../vibememory-cli" }
vibememory-core = { path = "../vibememory-core" }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
